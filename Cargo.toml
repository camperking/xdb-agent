[package]
name = "chat-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
futures = "0.3"
hex = "0.4"
presage = { git = "https://github.com/whisperfish/presage", default-features = false }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage" }
qr2term = "0.3"
rig-core = "0.31.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3"
thiserror = "2.0.18"
toml = "0.8"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
scraper = "0.25.0"
htmd = "0.5.4"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }
